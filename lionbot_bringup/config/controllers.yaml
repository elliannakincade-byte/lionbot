controller_manager:
  ros__parameters:
    update_rate: 20

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController


diff_drive_controller:
  ros__parameters:

    # Logical tracked drivetrain joints
    left_wheel_names:
      - left_drive_joint

    right_wheel_names:
      - right_drive_joint

    # Initial measured drivetrain geometry
    wheel_separation: 0.370
    wheel_radius: 0.0325

    # Use real encoder position feedback for odometry
    position_feedback: true
    open_loop: false

    # TF / odometry frames
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true

    # Initial calibration multipliers
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # Stop if velocity commands disappear
    cmd_vel_timeout: 0.5

    publish_limited_velocity: true
    velocity_rolling_window_size: 10
